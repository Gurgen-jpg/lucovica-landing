schema: spec-driven

context: |
  Проект: landing_v2 — полный переписанный сайт студии эпиляции LUCOVICA (Ростов-на-Дону, lucovica.ru).
  Заменяет ../landing (Next.js 15 + React + Tailwind). Старый проект — эталон поведения и контента,
  его код не переиспользуется напрямую, но данные (цены, тексты, FAQ) переносятся.

  Стек (фиксирован, не обсуждается в артефактах):
  - HTML генерируется при сборке (SSG) из типизированных TypeScript-шаблонов (функции, возвращающие строки).
  - Клиентский интерактив — чистый TypeScript без фреймворков. НЕТ React, НЕТ Radix, НЕТ Tailwind.
    Доступность интерактивных компонентов (dialog, tabs, accordion, carousel, toast) — по WAI-ARIA APG.
  - CSS: чистый CSS, единственный источник значений — src/ds/tokens.css (CSS custom properties).
    Компоненты не содержат HEX-кодов.
  - Сервер: Express (Node 22) — отдаёт собранную статику из dist/ и обслуживает /api/*.
  - Тесты: Vitest (unit/API), Playwright (e2e).
  - Деплой: Timeweb (Node-приложение).

  Дизайн-система: «LUCOVICA — Design System 2.0, Plaster & Onyx» (../LUCOVICA — Design System 2.0.html).
  Шрифты: Cormorant Garamond (display), Jost (text). Радиус 0. Easing --ease-silk, длительность 320ms.

  Язык артефактов: русский. Нормативные ключевые слова спек (SHALL/MUST, WHEN/THEN) — на английском.
  Весь пользовательский текст сайта — на русском.

rules:
  proposal:
    - Указывай, какое поведение старого ../landing переносится без изменений, а какое меняется.
  tasks:
    - Каждая задача заканчивается проверяемым результатом (команда, тест или ручная проверка в браузере).
